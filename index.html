<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LiveTVizle - Canlı TV & Radyo</title>
    <meta name="description" content="TV ve radyo yayınlarını takip edebileceğiniz, YouTube benzeri kalıcı oynatıcısı olan platform." />
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.svg" />
    
    <!-- Theme & Colors -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="background-color" content="#0f172a" />
    
    <!-- Apply saved theme before first paint to avoid flash of wrong theme -->
    <script>
      (function () {
        var isDark = true;
        try {
          var s = JSON.parse(localStorage.getItem('broadcastAppState'));
          if (s && s.themeMode === 'light') isDark = false;
        } catch (e) {}
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    
    <!-- Mobile & iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiveTVizle" />

    <!-- OpenGraph -->
    <meta property="og:title" content="LiveTVizle - Canlı TV & Radyo" />
    <meta property="og:description" content="TV ve radyo yayınlarını takip edebileceğiniz, YouTube benzeri kalıcı oynatıcısı olan platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icon-512.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
